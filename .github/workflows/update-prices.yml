name: Update Di4m0ndH4nd5 prices and risk

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependency
        run: pip install requests

      - name: Fetch market data and recalculate risk
        run: python update_prices.py

      - name: Commit refreshed data
        run: |
          git config user.name "di4m0ndh4nd5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update hourly prices and risk"
          git push
